steps:
  - step: Segmentation
    settings:
      model: YOLO
      model_settings:
        model: Riksarkivet/yolov9-lines-within-regions-1
        device: cpu
      generation_settings:
        batch_size: 1
  - step: TextRecognition
    settings:
      model: TrOCR
      model_settings:
        model: microsoft/trocr-base-handwritten
        device: cpu
      generation_settings:
        batch_size: 8
        num_beams: 1
  - step: OrderLines
  - step: Export
    settings:
      format: txt
      dest: output/htrflow-smoke
  - step: Export
    settings:
      format: json
      dest: output/htrflow-smoke
