<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#264766" flood-opacity="0.16" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .stage { font: 700 25px 'Microsoft YaHei', sans-serif; fill: #245b91; }
      .chapter { font: 700 25px 'Microsoft YaHei', sans-serif; fill: #173a5e; }
      .desc { font: 20px 'Microsoft YaHei', sans-serif; fill: #3f5368; }
      .small { font: 18px 'Microsoft YaHei', sans-serif; fill: #52687d; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>

  <rect x="45" y="55" width="1310" height="145" rx="20" fill="#edf5fc" stroke="#7fa9d2" stroke-width="2"/>
  <text x="80" y="102" class="stage">研究提出</text>
  <rect x="245" y="80" width="1045" height="95" rx="16" fill="#ffffff" stroke="#9abada" stroke-width="2" filter="url(#shadow)"/>
