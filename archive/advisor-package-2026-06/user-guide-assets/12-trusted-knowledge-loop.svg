<text x="610" y="440" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#3f5368"><tspan x="610" dy="0">实体 / 关系抽取</tspan><tspan x="610" dy="42">按项目隔离</tspan></text>
