services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eln-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eln}
      POSTGRES_USER: ${POSTGRES_USER:-eln_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eln_password}
    # ports only needed for external DB clients; backend connects via internal Docker network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eln_user} -d ${POSTGRES_DB:-eln}"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    build:
      context: ./embedding-service
    container_name: eln-embedding
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSION:-512}
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s

  backend:
    build:
      context: ./backend
    container_name: eln-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    container_name: eln-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  frontend_node_modules:
  embedding_models:
