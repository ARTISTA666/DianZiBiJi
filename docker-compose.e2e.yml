services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eln_e2e
      POSTGRES_USER: eln_e2e
      POSTGRES_PASSWORD: eln_e2e
    volumes:
      - e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eln_e2e -d eln_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  llm-stub:
    image: python:3.12-slim
    volumes:
      - ./frontend/e2e/llm_stub.py:/stub.py:ro
    command: ["python", "/stub.py"]

  backend:
    build:
      context: ./backend
    image: eln-backend-e2e
    environment:
      POSTGRES_DB: eln_e2e
      POSTGRES_USER: eln_e2e
      POSTGRES_PASSWORD: eln_e2e
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: e2e-only-secret
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: http://127.0.0.1:13000
      DEEPSEEK_API_BASE_URL: http://llm-stub:8080
      DEEPSEEK_API_KEY: e2e-key
      DEEPSEEK_MODEL: e2e-stub
    ports:
      - "18000:8000"
    volumes:
      - e2e_storage:/storage
    depends_on:
      db:
        condition: service_healthy
      llm-stub:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/ready"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18000
    image: eln-frontend-e2e
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18000
    ports:
      - "13000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  e2e_postgres:
  e2e_storage:
