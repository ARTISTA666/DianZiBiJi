[package]
name = "eln-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
axum = { version = "=0.8.4", features = ["multipart"] }
axum-extra = { version = "=0.10.1", features = ["typed-header"] }
base64 = "=0.22.1"
bcrypt = "=0.17.0"
chrono = { version = "=0.4.41", features = ["serde"] }
flate2 = "=1.1.2"
hmac = "=0.12.1"
image = { version = "=0.25.6", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
pbkdf2 = "=0.12.2"
regex = "=1.11.1"
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.141"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "derive", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "=2.6.1"
thiserror = "=2.0.12"
tokio = { version = "=1.47.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
tower-http = { version = "=0.6.6", features = ["cors", "request-id", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
uuid = { version = "=1.17.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.20.0"
tower = { version = "=0.5.2", features = ["util"] }
