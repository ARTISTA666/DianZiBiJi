const KEY = "blindreview_v2";
function load(){ try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}} }
function save(d){ localStorage.setItem(KEY, JSON.stringify(d)) }
let state = load();
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;") }
function render(){
  const c = document.getElementById("cards"); c.innerHTML = "";
  let done = 0;
  for(const e of E){
    const s = state[e.blind_id] || {};
    const filled = s.acc !== undefined && s.trace !== undefined && s.score;
    if(filled) done++;
    const div = document.createElement("div");
    div.className = "card" + (filled ? " done" : "");
    div.innerHTML = `
      <div><span class="bid">${e.blind_id}</span>${e.has_g?'<span class="badge">含 [G] 证据 · 判定最强约束</span>':''}</div>
      <div class="sec"><span class="lab">问题：</span>${esc(e.question)}</div>
      <div class="sec ref"><span class="lab">判定参照（答案要点组）：</span>${esc(e.ref)}</div>
      <div class="sec"><span class="lab">回答：</span><div class="ans">${esc(e.answer)}</div></div>
      ${e.ev_s ? `<div class="sec"><span class="lab">证据来源 [S]：</span><div class="ev">${esc(e.ev_s)}</div></div>` : ""}
      ${e.ev_g ? `<div class="sec"><span class="lab">图谱关系 [G]：</span><div class="ev">${esc(e.ev_g)}</div></div>` : ""}
      <div class="sec">
        <b>准确性：</b><label><input type="radio" name="a${e.blind_id}" value="准确" ${s.acc==="准确"?"checked":""}>准确</label>
        <label><input type="radio" name="a${e.blind_id}" value="不准确" ${s.acc==="不准确"?"checked":""}>不准确</label>
        &nbsp;<b>可追溯性：</b><label><input type="radio" name="t${e.blind_id}" value="可追溯" ${s.trace==="可追溯"?"checked":""}>可追溯</label>
        <label><input type="radio" name="t${e.blind_id}" value="不可追溯" ${s.trace==="不可追溯"?"checked":""}>不可追溯</label>
        &nbsp;<b>评分：</b>
        <select name="s${e.blind_id}">
          <option value="">—</option>${[5,4,3,2,1].map(v=>`<option ${s.score==v?"selected":""}>${v}</option>`).join("")}
        </select>
      </div>
      <div class="sec"><b>备注：</b><textarea name="c${e.blind_id}">${esc(s.comment)}</textarea></div>`;
    c.appendChild(div);
  }
  document.getElementById("prog").textContent = done;
  document.querySelectorAll("input,select,textarea").forEach(el=>{
    el.addEventListener("change", ()=>{ collect(); render(); });
    el.addEventListener("input", ()=>{ collect(); prog(); });
  });
}
function collect(){
  for(const e of E){
    const a = document.querySelector(`input[name=a${e.blind_id}]:checked`);
    const tr = document.querySelector(`input[name=t${e.blind_id}]:checked`);
    const sc = document.querySelector(`select[name=s${e.blind_id}]`);
    const cm = document.querySelector(`textarea[name=c${e.blind_id}]`);
    const s = state[e.blind_id] || {};
    s.acc = a ? a.value : s.acc; s.trace = tr ? tr.value : s.trace;
    s.score = sc ? sc.value : s.score; s.comment = cm ? cm.value : s.comment;
    state[e.blind_id] = s;
  }
  save(state);
}
function prog(){
  let done = 0;
  for(const e of E){ const s = state[e.blind_id]||{}; if(s.acc!==undefined && s.trace!==undefined && s.score) done++; }
  document.getElementById("prog").textContent = done;
}
document.getElementById("exp").addEventListener("click", ()=>{
  collect();
  const missing = E.filter(e=>{ const s=state[e.blind_id]||{}; return s.acc===undefined||s.trace===undefined||!s.score; });

  if(missing.length){ w.textContent = "未评完：" + missing.map(e=>e.blind_id).join(","); return; }
  if(badNote.length){ w.textContent = "按协议需补备注：" + badNote.map(e=>e.blind_id).join(","); return; }
  w.textContent = "";
  let csv = "\ufeffblind_id,is_accurate,is_traceable,score_1_to_5,reviewer_comment\n";
  for(const e of E){
    const s = state[e.blind_id];
    csv += `${e.blind_id},${s.acc},${s.trace},${s.score},"${(s.comment||"").replace(/"/g,'""')}"\n`;
  }
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "rag-experiment-4-blind-review-filled.csv"; a.click();
});
