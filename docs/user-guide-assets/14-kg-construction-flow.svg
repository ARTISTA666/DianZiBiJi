<text x="530" y="470" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#a86318"><tspan x="530" dy="0">否：退回修改并记录意见</tspan></text>
