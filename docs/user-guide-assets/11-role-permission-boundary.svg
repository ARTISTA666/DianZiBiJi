<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#264766" flood-opacity="0.15" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#547aa5"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="55" y="55" width="1490" height="790" rx="24" fill="#f8fafc" stroke="#8aa7c2" stroke-width="2"/>
<rect x="85" y="90" width="620" height="710" rx="22" fill="#edf5fc" stroke="#7fa9d2" stroke-width="2"/>
<rect x="735" y="90" width="780" height="710" rx="22" fill="#f4f7fa" stroke="#9aaec0" stroke-width="2"/>
<text x="395" y="145" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#245b91"><tspan x="395" dy="0">系统级作用域</tspan></text>
<text x="1125" y="145" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#245b91"><tspan x="1125" dy="0">项目级作用域（按 project_id 隔离）</tspan></text>
<rect x="170" y="205" width="450" height="150" rx="18" fill="#ffffff" stroke="#5686b5" stroke-width="2" filter="url(#shadow)"/>
<text x="395" y="255" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#173a5e"><tspan x="395" dy="0">系统管理员  SUPER_ADMIN</tspan></text>
<text x="395" y="302" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#3f5368"><tspan x="395" dy="0">账号与全局角色 · 项目创建</tspan><tspan x="395" dy="36">全局统计 · 跨项目运维</tspan></text>
<line x1="395" y1="355" x2="395" y2="410" stroke="#547aa5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="130" y="435" width="530" height="245" rx="18" fill="#ffffff" stroke="#9abada" stroke-width="2" filter="url(#shadow)"/>
<text x="395" y="480" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#245b91"><tspan x="395" dy="0">可管理</tspan></text>
<text x="395" y="525" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#3f5368"><tspan x="395" dy="0">用户账号与状态</tspan><tspan x="395" dy="40">全局角色</tspan><tspan x="395" dy="40">任意项目异常处置</tspan></text>
<rect x="785" y="205" width="680" height="110" rx="18" fill="#ffffff" stroke="#5686b5" stroke-width="2" filter="url(#shadow)"/>
<text x="965" y="250" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#173a5e"><tspan x="965" dy="0">项目负责人</tspan></text>
<text x="1270" y="238" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#3f5368"><tspan x="1270" dy="0">成员与配置管理</tspan><tspan x="1270" dy="34">项目内读 / 写 / 审核</tspan></text>
<rect x="785" y="345" width="320" height="125" rx="18" fill="#ffffff" stroke="#8eafd0" stroke-width="2" filter="url(#shadow)"/>
<text x="945" y="390" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#173a5e"><tspan x="945" dy="0">审核人员</tspan></text>
<text x="945" y="432" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#3f5368"><tspan x="945" dy="0">读取 · 审核 · 评价</tspan></text>
<rect x="1145" y="345" width="320" height="125" rx="18" fill="#ffffff" stroke="#8eafd0" stroke-width="2" filter="url(#shadow)"/>
