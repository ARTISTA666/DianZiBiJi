<text x="1305" y="432" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#3f5368"><tspan x="1305" dy="0">读取 · 编辑 · 智能生成</tspan></text>
<rect x="785" y="500" width="320" height="125" rx="18" fill="#ffffff" stroke="#8eafd0" stroke-width="2" filter="url(#shadow)"/>
<text x="945" y="545" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#173a5e"><tspan x="945" dy="0">只读成员</tspan></text>
<text x="945" y="587" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#3f5368"><tspan x="945" dy="0">仅查看授权项目</tspan></text>
<rect x="1145" y="500" width="320" height="125" rx="18" fill="#fff7ed" stroke="#d99a51" stroke-width="2" filter="url(#shadow)"/>
<text x="1305" y="545" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#9a5a13"><tspan x="1305" dy="0">权限边界</tspan></text>
<text x="1305" y="582" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#3f5368"><tspan x="1305" dy="0">不可管理系统用户</tspan><tspan x="1305" dy="33">不可访问其他项目</tspan></text>
<rect x="785" y="665" width="680" height="90" rx="18" fill="#eaf7f4" stroke="#65a99b" stroke-width="2"/>
<text x="1125" y="720" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#246b60"><tspan x="1125" dy="0">后端接口统一校验：读取 · 写入 · 审核 · 管理</tspan></text>
<line x1="720" y1="185" x2="720" y2="770" stroke="#d0832f" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="640" y="410" width="160" height="62" rx="14" fill="#fff7ed" stroke="#d99a51" stroke-width="2"/>
<text x="720" y="450" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#a86318"><tspan x="720" dy="0">最小权限边界</tspan></text>
</svg>
