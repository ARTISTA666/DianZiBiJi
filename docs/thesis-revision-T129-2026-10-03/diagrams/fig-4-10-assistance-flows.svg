<text x="215" y="490.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">发起项目内对话</text>
<polyline points="380,490 420,490" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
