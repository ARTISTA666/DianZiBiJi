<text x="1695" y="215.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">记录调用审计</text>
<text x="50" y="345" font-family="Songti SC, serif" font-size="42" font-weight="bold" text-anchor="start" dominant-baseline="central">B  系统会话辅助</text>
