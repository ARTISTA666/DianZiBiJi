<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="950" viewBox="0 0 1900 950">
<rect width="100%" height="100%" fill="white"/>
<text x="50" y="45" font-family="Songti SC, serif" font-size="42" font-weight="bold" text-anchor="start" dominant-baseline="central">A  外部工具调用</text>
<rect x="50" y="100" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="215" y="190.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">获取完整工具清单</text>
<polyline points="380,190 420,190" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="420,190 400.0,180.0 400.0,200.0" fill="black"/>
<rect x="420" y="100" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="585" y="190.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">提交工具与参数</text>
<polyline points="750,190 790,190" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="790,190 770.0,180.0 770.0,200.0" fill="black"/>
