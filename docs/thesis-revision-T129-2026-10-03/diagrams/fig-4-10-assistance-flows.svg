<text x="585" y="765.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">筛选已审核证据</text>
<text x="585" y="815.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">按任务模板组装</text>
<polyline points="750,790 790,790" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="790,790 770.0,780.0 770.0,800.0" fill="black"/>
<rect x="790" y="700" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="955" y="790.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">调用模型生成草稿</text>
<polyline points="1120,790 1160,790" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1160,790 1140.0,780.0 1140.0,800.0" fill="black"/>
<rect x="1160" y="700" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="1325" y="765.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">检查来源与引用</text>
<text x="1325" y="815.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">必要时有限修订</text>
<polyline points="1490,790 1530,790" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1530,790 1510.0,780.0 1510.0,800.0" fill="black"/>
<rect x="1530" y="700" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="1695" y="765.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">保存草稿与来源</text>
<text x="1695" y="815.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">供用户核对</text>
