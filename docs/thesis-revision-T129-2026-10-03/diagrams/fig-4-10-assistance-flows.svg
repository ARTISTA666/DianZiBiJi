<rect x="1160" y="100" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="1325" y="165.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">执行非高风险工具</text>
<text x="1325" y="215.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">高风险登记待确认</text>
<polyline points="1490,190 1530,190" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
