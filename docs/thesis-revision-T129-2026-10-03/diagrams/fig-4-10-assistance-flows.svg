<text x="955" y="215.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">核验参数和授权</text>
<polyline points="1120,190 1160,190" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
