<text x="585" y="515.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">模型提出工具调用</text>
<polyline points="750,490 790,490" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="790,490 770.0,480.0 770.0,500.0" fill="black"/>
<rect x="790" y="400" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="955" y="465.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">核验参数和授权</text>
<text x="955" y="515.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">检查风险与幂等键</text>
<polyline points="1120,490 1160,490" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1160,490 1140.0,480.0 1140.0,500.0" fill="black"/>
<rect x="1160" y="400" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="1325" y="465.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">执行非高风险工具</text>
<text x="1325" y="515.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">高风险登记待确认</text>
<polyline points="1490,490 1530,490" fill="none" stroke="black" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1530,490 1510.0,480.0 1510.0,500.0" fill="black"/>
<rect x="1530" y="400" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
<text x="1695" y="465.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">汇报结果或待确认</text>
<text x="1695" y="515.0" font-family="Songti SC, serif" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="central">保存会话与审计</text>
<text x="50" y="645" font-family="Songti SC, serif" font-size="42" font-weight="bold" text-anchor="start" dominant-baseline="central">C  固定任务生成</text>
<rect x="50" y="700" width="330" height="180" fill="white" stroke="black" stroke-width="3"/>
