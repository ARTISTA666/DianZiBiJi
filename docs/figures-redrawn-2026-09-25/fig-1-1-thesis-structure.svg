<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="1800" height="820" fill="#ffffff"/>

  <!-- 上排：第1-4章 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="30" y="90" width="380" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="220" y="150" font-size="24" font-weight="bold">第一章 绪论</text>
    <text x="220" y="190" font-size="19">提出问题 · 界定研究范围</text>

    <rect x="480" y="90" width="380" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="670" y="150" font-size="24" font-weight="bold">第二章 相关理论与技术</text>
    <text x="670" y="190" font-size="19">理论与技术基础</text>

    <rect x="930" y="90" width="380" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1120" y="150" font-size="24" font-weight="bold">第三章 需求分析</text>
    <text x="1120" y="190" font-size="19">流程、角色与需求</text>

    <rect x="1380" y="90" width="390" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1575" y="150" font-size="24" font-weight="bold">第四章 系统设计</text>
    <text x="1575" y="190" font-size="19">架构、数据与机制</text>
  </g>

  <!-- 上排横向箭头 -->
  <line x1="410" y1="165" x2="478" y2="165" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="860" y1="165" x2="928" y2="165" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1310" y1="165" x2="1378" y2="165" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 下排：第7/6/5章 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="470" y="600" width="380" height="150" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="660" y="660" font-size="24" font-weight="bold">第七章 总结与展望</text>
    <text x="660" y="700" font-size="19">归纳工作、局限与后续验证</text>

    <rect x="920" y="600" width="380" height="150" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="1110" y="660" font-size="24" font-weight="bold">第六章 测试与分析</text>
    <text x="1110" y="700" font-size="19">测试、对照与失败分析</text>

    <rect x="1370" y="600" width="390" height="150" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="1565" y="660" font-size="24" font-weight="bold">第五章 系统实现</text>
    <text x="1565" y="700" font-size="19">关键功能与操作案例</text>
  </g>

  <!-- 下排反向箭头（5->6->7） -->
  <line x1="1370" y1="675" x2="1302" y2="675" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="920" y1="675" x2="852" y2="675" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第四章 -> 第五章 实线 -->
  <line x1="1575" y1="240" x2="1575" y2="598" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第二章 -> 第四章 虚线（顶部）"理论支撑方法设计" -->
  <path d="M670,90 L670,40 L1575,40 L1575,88" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6,5" marker-end="url(#arrGray)"/>
  <text x="1122" y="32" font-family="Songti SC, serif" font-size="17" fill="#666" text-anchor="middle">理论支撑方法设计</text>

  <!-- 第三章 -> 第六章 虚线 "需求牵引验证" -->
  <path d="M1120,240 L1120,598" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6,5" marker-end="url(#arrGray)"/>
  <text x="1140" y="430" font-family="Songti SC, serif" font-size="17" fill="#666">需求牵引验证</text>
</svg>
