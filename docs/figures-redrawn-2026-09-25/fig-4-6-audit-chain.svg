<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="620" viewBox="0 0 1700 620">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1700" height="620" fill="#ffffff"/>

  <!-- 左三层 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="30" y="50" width="380" height="130" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="220" y="95" font-size="21" font-weight="bold">资料来源层</text>
    <text x="220" y="130" font-size="18">[S1]…[Sn] 资料块 ·</text>
    <text x="220" y="158" font-size="18">向量/词项/融合分数</text>

    <rect x="30" y="250" width="380" height="130" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="220" y="295" font-size="21" font-weight="bold">图谱依据层</text>
    <text x="220" y="330" font-size="18">[G1]…[Gn] 关系 · 置信度 · 得分</text>

    <rect x="30" y="450" width="380" height="130" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="220" y="495" font-size="21" font-weight="bold">评价层</text>
    <text x="220" y="530" font-size="18">评分 1–5 · 准确性 · 可追溯性</text>
  </g>

  <!-- 中心 ai_query_logs -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="620" y="230" width="440" height="180" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="840" y="275" font-size="22" font-weight="bold" font-family="Menlo, monospace">ai_query_logs</text>
    <text x="840" y="315" font-size="18">问题 · 回答 · 模式 · 图谱命中数 ·</text>
    <text x="840" y="345" font-size="18">Token · 时延 · 提示版本 · 回退原因</text>
  </g>

  <!-- ai_experiment_runs（虚线外部） -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="680" y="50" width="320" height="110" fill="#fff" stroke="#8B7A3E" stroke-width="1.5" stroke-dasharray="7,5"/>
    <text x="840" y="90" font-size="20" font-weight="bold" font-family="Menlo, monospace">ai_experiment_runs</text>
    <text x="840" y="125" font-size="17">运行编号 · 配置快照 · 语料哈希</text>
  </g>

  <!-- 右侧：结果复现与人工复核 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="1230" y="260" width="420" height="120" fill="#fff" stroke="#8B7A3E" stroke-width="1.5" stroke-dasharray="7,5"/>
    <text x="1440" y="305" font-size="20" font-weight="bold">结果复现与人工复核</text>
    <text x="1440" y="340" font-size="18">按编号回查原始记录</text>
  </g>

  <!-- 连线 -->
  <line x1="410" y1="115" x2="618" y2="280" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="315" x2="618" y2="320" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="515" x2="618" y2="370" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="1060" y1="320" x2="1228" y2="320" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 双向箭头：experiment_runs <-> query_logs -->
  <line x1="840" y1="160" x2="840" y2="228" stroke="#666" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polygon points="840,228 835,218 845,218" fill="#666"/>
  <polygon points="840,160 835,170 845,170" fill="#666"/>
</svg>
