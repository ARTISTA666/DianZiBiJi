<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- 顶部：状态机说明 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="280" y="30" width="640" height="60" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="600" y="68" font-size="18">实验笔记状态机：DRAFT → SUBMITTED → APPROVED / RETURNED</text>
  </g>

  <!-- 菱形判断 -->
  <polygon points="380,180 520,240 380,300 240,240" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="380" y="248" font-family="Songti SC, serif" font-size="20" text-anchor="middle">APPROVED ?</text>

  <!-- 顶部 -> 菱形 -->
  <line x1="600" y1="90" x2="400" y2="180" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 否：左分支 -->
  <g font-family="Songti SC, STSong, serif">
    <rect x="30" y="200" width="200" height="80" fill="#f0f0f0" stroke="#666" stroke-width="1.3"/>
    <text x="130" y="235" font-size="17" text-anchor="middle">DRAFT / RETURNED：</text>
    <text x="130" y="262" font-size="17" text-anchor="middle">不触发任何图谱写入</text>
  </g>
  <line x1="240" y1="240" x2="232" y2="240" stroke="#666" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrGray)"/>
  <text x="255" y="228" font-family="Songti SC, serif" font-size="16" fill="#555">否</text>

  <!-- 是：右纵向五步 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="640" y="150" width="520" height="70" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="900" y="180" font-size="18">基础实体生成：项目 / 笔记 / 创建者 / 实验类型 / 附件</text>
    <text x="900" y="205" font-size="16" fill="#555">（conf = 1.0）</text>

    <rect x="640" y="250" width="520" height="70" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="900" y="280" font-size="18">实验对象抽取：试剂 / 仪器 / 样本 / 结果术语</text>
    <text x="900" y="305" font-size="16" fill="#555">（conf = 0.7）</text>

    <rect x="640" y="350" width="520" height="60" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="900" y="387" font-size="18">归一化与自然键去重（见 4.6.4 节）</text>

    <rect x="640" y="440" width="520" height="60" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="900" y="477" font-size="18">关系 upsert 写入 kg_relations（唯一约束防重）</text>

    <rect x="640" y="530" width="520" height="60" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="900" y="567" font-size="18">抽取运行落库 kg_extraction_runs（状态与计数）</text>
  </g>

  <!-- 菱形 -> 第一步 -->
  <line x1="520" y1="240" x2="638" y2="185" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="215" font-family="Songti SC, serif" font-size="16" fill="#555">是</text>

  <!-- 纵向箭头 -->
  <line x1="900" y1="220" x2="900" y2="248" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="320" x2="900" y2="348" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="410" x2="900" y2="438" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="500" x2="900" y2="528" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
