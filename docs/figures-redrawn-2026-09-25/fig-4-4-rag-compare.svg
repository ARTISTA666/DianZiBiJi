<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1700" height="1050" fill="#ffffff"/>

  <!-- 横向主链：用户问题 -> 权限校验 -> 混合检索 -> 资料证据 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="30" y="60" width="200" height="100" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="130" y="120" font-size="22">用户问题</text>

    <rect x="310" y="60" width="260" height="100" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="440" y="108" font-size="21">项目权限</text>
    <text x="440" y="138" font-size="21">校验</text>

    <rect x="660" y="50" width="340" height="120" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="830" y="90" font-size="21">项目内混合检索</text>
    <text x="830" y="120" font-size="20">BM25 + 向量</text>
    <text x="830" y="150" font-size="20">RRF 融合</text>

    <rect x="1130" y="60" width="300" height="100" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1280" y="105" font-size="20">资料证据 top-6</text>
    <text x="1280" y="138" font-size="19">编号 [S1]…[Sn]</text>
  </g>

  <line x1="230" y1="110" x2="308" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="110" x2="658" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1000" y1="110" x2="1128" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 分叉：普通模式 / 图谱增强模式 -->
  <path d="M1280,160 L1280,260 L480,260 L480,350" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M1280,160 L1280,350" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="260" y="350" width="440" height="140" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="480" y="405" font-size="22" font-weight="bold">普通模式</text>
    <text x="480" y="445" font-size="20">组装提示：仅 [S] 资料</text>

    <rect x="1040" y="350" width="460" height="140" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="1270" y="405" font-size="22" font-weight="bold">图谱增强模式</text>
    <text x="1270" y="440" font-size="19">式（4-5）单关系评分 top-10</text>
    <text x="1270" y="470" font-size="19">注入 [G] 一跳上下文</text>
  </g>

  <!-- 汇合到 DeepSeek -->
  <path d="M480,490 L480,680 L800,680" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M1270,490 L1270,680 L900,680" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="680" y="640" width="340" height="110" fill="#FFF8D6" stroke="#8B7A3E" stroke-width="1.5" stroke-dasharray="7,5"/>
    <text x="850" y="690" font-size="22" font-weight="bold">DeepSeek 生成</text>
    <text x="850" y="725" font-size="20">temperature = 0.1</text>
  </g>

  <!-- DeepSeek -> 回存 -->
  <line x1="850" y1="750" x2="850" y2="850" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="640" y="850" width="420" height="110" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="850" y="895" font-size="20">ai_query_logs 回存</text>
    <text x="850" y="930" font-size="19">来源 · Token · 时延</text>
  </g>
</svg>
