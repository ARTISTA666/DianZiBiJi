<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="820" viewBox="0 0 1900 820">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1900" height="820" fill="#ffffff"/>

  <!-- 横向起点 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="20" y="60" width="200" height="110" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="120" y="105" font-size="20">用户提问</text>
    <text x="120" y="135" font-size="18">问题文本</text>

    <rect x="290" y="50" width="240" height="130" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="410" y="90" font-size="19">权限与数据检查</text>
    <text x="410" y="118" font-size="17">项目授权 · 数据集状态</text>

    <rect x="600" y="60" width="240" height="110" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="720" y="105" font-size="19">项目内混合检索</text>
    <text x="720" y="135" font-size="18">资料检索</text>
  </g>

  <line x1="220" y1="115" x2="288" y2="115" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="115" x2="598" y2="115" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 菱形问答模式 -->
  <polygon points="1040,115 1140,60 1240,115 1140,170" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="1140" y="122" font-family="Songti SC, serif" font-size="19" text-anchor="middle">问答模式</text>
  <line x1="840" y1="115" x2="1038" y2="115" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 两个模式框（纵向） -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="870" y="330" width="260" height="90" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1000" y="368" font-size="19">普通模式</text>
    <text x="1000" y="398" font-size="17">使用检索资料块</text>

    <rect x="870" y="480" width="260" height="90" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1000" y="518" font-size="19">图谱增强模式</text>
    <text x="1000" y="548" font-size="17">增加一跳关系</text>
  </g>

  <!-- 菱形 -> 普通（直下） -->
  <line x1="1140" y1="170" x2="1000" y2="328" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1080" y="260" font-family="Songti SC, serif" font-size="16" fill="#555">普通 RAG</text>
  <!-- 菱形 -> 图谱增强（斜下） -->
  <path d="M1180,155 L1280,250 L1130,330" fill="none" stroke="#222" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="1230" y="220" font-family="Songti SC, serif" font-size="16" fill="#555">图谱增强 RAG</text>

  <!-- 普通 -> 图谱增强 -->
  <line x1="1000" y1="420" x2="1000" y2="478" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 组织证据 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="1240" y="400" width="280" height="100" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1380" y="438" font-size="18">组织证据并构造输入</text>
    <text x="1380" y="468" font-size="18">资料 [S] · 关系 [G]</text>
  </g>
  <path d="M1130,525 L1238,460" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DeepSeek 官方接口（外部服务，米黄虚线） -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="1580" y="400" width="250" height="100" fill="#FFF8D6" stroke="#8B7A3E" stroke-width="1.5" stroke-dasharray="7,5"/>
    <text x="1705" y="440" font-size="19">DeepSeek 官方接口</text>
    <text x="1705" y="470" font-size="18">生成回答</text>
  </g>
  <line x1="1520" y1="450" x2="1578" y2="450" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 成功 -> 保存 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="1580" y="640" width="250" height="120" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="1705" y="680" font-size="18">保存回答与来源</text>
    <text x="1705" y="710" font-size="17">配置 · Token</text>
    <text x="1705" y="738" font-size="17">· 响应时延</text>
  </g>
  <line x1="1705" y1="500" x2="1705" y2="638" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1720" y="580" font-family="Songti SC, serif" font-size="16" fill="#555">成功</text>

  <!-- 上游失败 -> 失败日志 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="1280" y="640" width="240" height="120" fill="#f0f0f0" stroke="#666666" stroke-width="1.5"/>
    <text x="1400" y="680" font-size="18">调用失败</text>
    <text x="1400" y="710" font-size="17">返回错误并保</text>
    <text x="1400" y="738" font-size="17">存失败日志</text>
  </g>
  <path d="M1620,500 L1620,580 L1400,580 L1400,638" fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="1480" y="570" font-family="Songti SC, serif" font-size="16" fill="#555">上游失败</text>
</svg>
