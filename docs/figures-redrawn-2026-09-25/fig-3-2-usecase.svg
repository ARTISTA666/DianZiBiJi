<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <rect width="1500" height="820" fill="#ffffff"/>

  <!-- 系统边界大框 -->
  <rect x="280" y="40" width="940" height="740" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="750" y="78" font-family="Songti SC, serif" font-size="24" font-weight="bold" text-anchor="middle">智能电子实验笔记系统</text>

  <!-- 用例矩形 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="420" y="120" width="300" height="64" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="570" y="160" font-size="19">创建与编辑实验笔记</text>

    <rect x="800" y="110" width="300" height="60" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="148" font-size="19">用户与全局角色管理</text>

    <rect x="470" y="220" width="200" height="56" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="570" y="255" font-size="19">知识库同步</text>

    <rect x="800" y="200" width="300" height="60" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="238" font-size="19">项目创建与全局统计</text>

    <rect x="400" y="330" width="340" height="64" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="570" y="370" font-size="19">AI 问答（普通/图谱增强）</text>

    <rect x="800" y="310" width="300" height="60" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="348" font-size="19">项目成员与权限配置</text>

    <rect x="830" y="400" width="240" height="56" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="435" font-size="19">提交与审批笔记</text>

    <rect x="430" y="480" width="280" height="56" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="570" y="515" font-size="19">固定任务智能生成</text>

    <rect x="830" y="480" width="240" height="56" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="515" font-size="19">上传与审核资料</text>

    <rect x="870" y="570" width="160" height="50" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="602" font-size="19">问答评价</text>

    <rect x="430" y="630" width="280" height="56" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="570" y="665" font-size="19">只读浏览与下载</text>

    <rect x="840" y="660" width="220" height="56" fill="#fff" stroke="#222" stroke-width="1.3"/>
    <text x="950" y="695" font-size="19">审计日志查询</text>
  </g>

  <!-- 连线（细灰） -->
  <g stroke="#888" stroke-width="1" fill="none">
    <!-- 普通成员(130,400) -->
    <line x1="180" y1="400" x2="418" y2="152"/>
    <line x1="180" y1="400" x2="468" y2="248"/>
    <line x1="180" y1="400" x2="398" y2="362"/>
    <line x1="180" y1="400" x2="428" y2="508"/>
    <!-- 只读成员(130,640) -->
    <line x1="180" y1="640" x2="428" y2="658"/>
    <!-- 系统管理员(1380,160) -->
    <line x1="1320" y1="205" x2="1102" y2="140"/>
    <line x1="1320" y1="205" x2="1102" y2="230"/>
    <line x1="1320" y1="205" x2="1102" y2="340"/>
    <!-- 项目负责人(1380,370) -->
    <line x1="1320" y1="415" x2="1102" y2="428"/>
    <line x1="1320" y1="415" x2="1102" y2="508"/>
    <!-- 审核人员(1380,580) -->
    <line x1="1320" y1="625" x2="1032" y2="595"/>
    <line x1="1320" y1="625" x2="1062" y2="688"/>
  </g>

  <!-- Stick figure 小人 -->
  <g stroke="#222" stroke-width="1.8" fill="none">
    <!-- 普通成员 -->
    <circle cx="130" cy="360" r="18"/>
    <line x1="130" y1="378" x2="130" y2="440"/>
    <line x1="105" y1="405" x2="155" y2="405"/>
    <line x1="130" y1="440" x2="108" y2="490"/>
    <line x1="130" y1="440" x2="152" y2="490"/>
    <!-- 只读成员 -->
    <circle cx="130" cy="600" r="18"/>
    <line x1="130" y1="618" x2="130" y2="680"/>
    <line x1="105" y1="645" x2="155" y2="645"/>
    <line x1="130" y1="680" x2="108" y2="730"/>
    <line x1="130" y1="680" x2="152" y2="730"/>
    <!-- 系统管理员 -->
    <circle cx="1380" cy="160" r="18"/>
    <line x1="1380" y1="178" x2="1380" y2="240"/>
    <line x1="1355" y1="205" x2="1405" y2="205"/>
    <line x1="1380" y1="240" x2="1358" y2="290"/>
    <line x1="1380" y1="240" x2="1402" y2="290"/>
    <!-- 项目负责人 -->
    <circle cx="1380" cy="370" r="18"/>
    <line x1="1380" y1="388" x2="1380" y2="450"/>
    <line x1="1355" y1="415" x2="1405" y2="415"/>
    <line x1="1380" y1="450" x2="1358" y2="500"/>
    <line x1="1380" y1="450" x2="1402" y2="500"/>
    <!-- 审核人员 -->
    <circle cx="1380" cy="580" r="18"/>
    <line x1="1380" y1="598" x2="1380" y2="660"/>
    <line x1="1355" y1="625" x2="1405" y2="625"/>
    <line x1="1380" y1="660" x2="1358" y2="710"/>
    <line x1="1380" y1="660" x2="1402" y2="710"/>
  </g>

  <g font-family="Songti SC, serif" font-size="20" text-anchor="middle">
    <text x="130" y="520">普通成员</text>
    <text x="130" y="760">只读成员</text>
    <text x="1380" y="315">系统管理员</text>
    <text x="1380" y="525">项目负责人</text>
    <text x="1380" y="735">审核人员</text>
  </g>
</svg>
