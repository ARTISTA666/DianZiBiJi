<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="620" viewBox="0 0 1860 620">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="1860" height="620" fill="#ffffff"/>

  <!-- 左上：系统管理员 -->
  <g font-family="Songti SC, STSong, serif">
    <rect x="30" y="60" width="430" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="245" y="105" font-size="22" font-weight="bold" text-anchor="middle">系统管理员（SUPER_ADMIN）</text>
    <text x="245" y="145" font-size="18" text-anchor="middle">账号与全局角色 · 项目创建 · 全局统计</text>
  </g>

  <!-- 右上：项目范围虚线大框 -->
  <rect x="620" y="40" width="1210" height="200" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="8,5"/>
  <text x="1225" y="30" font-family="Songti SC, serif" font-size="17" fill="#666" text-anchor="middle">项目范围（project_id 隔离）</text>

  <!-- 四个角色块 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="650" y="80" width="260" height="120" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="780" y="130" font-size="22" font-weight="bold">项目负责人</text>
    <text x="780" y="168" font-size="18" font-family="Menlo, monospace" fill="#333">can_manage</text>

    <rect x="930" y="80" width="260" height="120" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1060" y="130" font-size="22" font-weight="bold">审核人员</text>
    <text x="1060" y="168" font-size="18" font-family="Menlo, monospace" fill="#333">can_review</text>

    <rect x="1210" y="80" width="260" height="120" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1340" y="130" font-size="22" font-weight="bold">普通成员</text>
    <text x="1340" y="168" font-size="18" font-family="Menlo, monospace" fill="#333">can_write</text>

    <rect x="1490" y="80" width="310" height="120" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1645" y="130" font-size="22" font-weight="bold">只读成员</text>
    <text x="1645" y="168" font-size="18" font-family="Menlo, monospace" fill="#333">can_read</text>
  </g>

  <!-- require_admin 虚线箭头 -->
  <path d="M460,135 L648,135" fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrDash)"/>
  <text x="554" y="122" font-family="Songti SC, serif" font-size="16" fill="#555" text-anchor="middle">require_admin</text>

  <!-- 左下：全局运维能力 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="30" y="430" width="430" height="130" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
    <text x="245" y="485" font-size="22" font-weight="bold">全局运维能力</text>
    <text x="245" y="525" font-size="18">不授予其他项目的日常业务权限</text>
  </g>

  <!-- 右下：项目业务接口 -->
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <rect x="720" y="430" width="1110" height="130" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1275" y="505" font-size="22">项目业务接口统一校验项目归属与能力位：读取 · 写入 · 审核 · 管理 · 评价</text>
  </g>

  <!-- 箭头：系统管理员 -> 全局运维 -->
  <line x1="245" y1="210" x2="245" y2="428" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 箭头：项目角色 -> 项目业务接口 -->
  <line x1="1275" y1="240" x2="1275" y2="428" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
